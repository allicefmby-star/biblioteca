{% extends "base.html" %}
{% block content %}
    <h1>Borrar Ejemplar</h1>
    <p>¿Estás seguro de que quieres borrar el ejemplar: <strong>{{ object }}</strong>?</p>
    <p style="color: #ffc107;">Advertencia: ¡No podrás borrar este ejemplar si tiene un préstamo activo (PROTECTED)!</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" style="color: red;">Confirmar Borrado</button>
        <a href="{% url 'ejemplares' %}">Cancelar</a>
    </form>
{% endblock %}
