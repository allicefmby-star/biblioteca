{% extends "base.html" %}
{% block content %}
<h2>Ingreso de inventario</h2>
<a href="{% url 'ingreso_create' %}">Registrar Nuevo Ingreso</a>
    <table class="table table-striped table-bordered">
        <thead class="thead-dark">
            <tr>
                <th>Fecha  </th>
                <th>proveedor</th>
 
            </tr>
        </thead>
        <tbody>
            {% for ingreso in ingresos %}
            <tr>

                <td>{{ ingreso.fecha }}</td>
                <td>{{ ingreso.proveedor }}</td>

            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="text-center text-muted">No hay ingresos de inventario agregados.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
