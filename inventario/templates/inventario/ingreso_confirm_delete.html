{% extends "base.html" %}
{% block content %}
    <h1>Borrar Ingreso de Inventario</h1>
    <p>¿Estás seguro de que quieres borrar el <strong>{{ object }}</strong>?</p>
    <p style="color: #ffc107;">Advertencia: Los ejemplares asociados a este ingreso no se borrarán, solo se quedarán sin registro de ingreso (SET_NULL).</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" style="color: red;">Confirmar Borrado</button>
        <a href="{% url 'ingresos' %}">Cancelar</a>
    </form>
{% endblock %}
