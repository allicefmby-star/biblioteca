{% extends "base.html" %}
{% block content %}
    <h1>Borrar Libro</h1>
    <p>¿Estás seguro de que quieres borrar el libro: <strong>{{ object.titulo }}</strong>?</p>
    <p style="color: #ffc107;">Advertencia: Esta acción no se puede deshacer.</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" style="color: red;">Confirmar Borrado</button>
        <a href="{% url 'libro' %}">Cancelar</a>
    </form>
{% endblock %}
