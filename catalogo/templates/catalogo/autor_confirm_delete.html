{% extends "base.html" %}
{% block content %}
    <h1>Borrar Autor</h1>
    <p>¿Estás seguro de que quieres borrar al autor: <strong>{{ object.nombre }} {{ object.apellido }}</strong>?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" style="color: red;">Confirmar Borrado</button>
        <a href="{% url 'Autor' %}">Cancelar</a>
    </form>
{% endblock %}
