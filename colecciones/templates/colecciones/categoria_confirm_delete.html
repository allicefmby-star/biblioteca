{% extends "base.html" %}
{% block content %}
    <h1>Borrar Categoría</h1>
    <p>¿Estás seguro de que quieres borrar la categoría: <strong>{{ object.nombre }}</strong>?</p>
    <p style="color: #ffc107;">Advertencia: Los libros asociados a esta categoría no se borrarán, solo perderán la categoría.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" style="color: red;">Confirmar Borrado</button>
        <a href="{% url 'lista_categorias' %}">Cancelar</a>
    </form>
{% endblock %}
