{% extends "base.html" %}
{% block content %}
<hr>

    <h2>Etiquetas</h2>
    <a href="{% url 'etiqueta_create' %}">Crear Nueva Etiqueta</a>
    <table class="table table-striped table-bordered">
        <thead class="thead-dark">
            <tr>
                <th>Nombre de Etiqueta</th>
            </tr>
        </thead>
        <tbody>
            {% for etiqueta in etiquetas %}
            <tr>
                <td>{{ etiqueta.nombre }}</td>
            </tr>
            {% empty %}
            <tr>
                <td class="text-center text-muted">No hay etiquetas agregadas.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
