{% extends "base.html" %}
{% block content %}
<h2>Ubicaciones Físicas</h2>
<a href="{% url 'ubicacion_create' %}">Crear Nueva Ubicación</a>
    <table class="table table-striped table-bordered">
        <thead class="thead-dark">
            <tr>
                <th>Sala</th>
                <th>Estante</th>
                <th>Nivel</th>
            </tr>
        </thead>
        <tbody>
            {% for ubicacion in ubicaciones %}
            <tr>
                <td>{{ ubicacion.sala }}</td>
                <td>{{ ubicacion.estante }}</td>
                <td>{{ ubicacion.nivel }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" class="text-center text-muted">No hay ubicaciones agregadas.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>
{% endblock %}
