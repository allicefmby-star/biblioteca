{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2>Categorías</h2>
    <a href="{% url 'categoria_create' %}">Crear Nueva Categoría</a> <table class="table table-striped table-bordered">
        <thead class="thead-dark">
            <tr>
                <th>Nombre de Categoría</th>
                <th>Slug (para URL)</th>
                <th>Acciones</th> </tr>
        </thead>
        <tbody>
            {% for categoria in categorias %}
            <tr>
                <td>{{ categoria.nombre }}</td>
                <td>{{ categoria.slug }}</td>
                <td>
                    <a href="{% url 'categoria_update' categoria.pk %}">Editar</a>
                    <a href="{% url 'categoria_delete' categoria.pk %}" style="color: #ff4136;">Borrar</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" class="text-center text-muted">No hay categorías agregadas.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>    
</div>
{% endblock %}
