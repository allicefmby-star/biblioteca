{% extends "base.html" %}
{% block content %}
    <h1>Borrar Préstamo</h1>
    <p>¿Estás seguro de que quieres borrar el <strong>{{ object }}</strong>?</p>
    <p>Advertencia: Si este préstamo tiene multas asociadas, también se borrarán (CASCADE).</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" style="color: red;">Confirmar Borrado</button>
        <a href="{% url 'prestamos' %}">Cancelar</a>
    </form>
{% endblock %}
