{% extends 'base.html' %}

{% block content %}
<h2>Gestión de Reservas</h2>
<a href="{% url 'reserva_create' %}">Crear Nueva Reserva</a>
<table class="table table-striped table-bordered">
    <thead class="thead-dark">
        <tr>
            <th>Préstamo</th>
            <th>Monto</th>
            <th>Motivo</th>
            <th>Pagada</th>
        </tr>
    </thead>
    <tbody>
        {% for multa in multas %}
        <tr>
            <td>{{ multa.prestamo }}</td>
            <td>{{ multa.monto }}</td>
            <td>{{ multa.motivo }}</td>
            <td>{{ multa.pagada }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4" class="text-center text-muted">No hay multas registradas.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
