{% extends "base.html" %}
{% block content %}
    <h1>Borrar Multa</h1>
    <p>¿Estás seguro de que quieres borrar la <strong>{{ object }}</strong>?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" style="color: red;">Confirmar Borrado</button>
        <a href="{% url 'multas' %}">Cancelar</a>
    </form>
{% endblock %}
